<div x-data="new LayoutController()" @resize.window="onResize()" @hashchange.window="onHashChange()">
  <header>
    <a class="left" @click="toggleNavigation()"><i class="fas fa-bars"></i></a>
    <h1>Sade Portal</h1>
    <a class="right"><i class="fas fa-power-off"></i></a>
    <a class="right"><i class="fas fa-cog"></i></a>
  </header>
  <nav :class="{ opened: hasNavigation }">
    <a href="#/home"><i class="fa-solid fa-home"></i>Home</a>
    <a href="#/users"><i class="fa-solid fa-user"></i>Users</a>
  </nav>
  <main :class="{ shifted: isShifted }" x-ref="main">
  </main>
  <div class="overlay" x-show="hasOverlay" @click="setNavigation(false)">
  </div>
</div>
