plugins {
    id 'java'
}

group 'com.sadesoft.portal'
version '0.0.0'

test {
    useJUnitPlatform()
}

sourceSets {
    main.java.srcDir("main/java")
    test.java.srcDir("test/java")
    main.resources.srcDir("main/resources")
    test.resources.srcDir("test/resources")
}

dependencies {
    implementation 'com.h2database:h2:2.1.214'
    implementation 'org.postgresql:postgresql:42.5.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.0'
    implementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
}
