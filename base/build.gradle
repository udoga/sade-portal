plugins {
    id 'java'
}

group 'com.sadesoft.portal'
version '0.0.0'

test {
    useJUnitPlatform()
}

sourceSets {
    main.java.srcDir("main/java")
    test.java.srcDir("test/java")
    main.resources.srcDir("main/resources")
    test.resources.srcDir("test/resources")
}

dependencies {
    implementation 'com.h2database:h2:2.1.214'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.1'
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation 'io.javalin:javalin:6.1.6'
    implementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}
