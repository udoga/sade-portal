plugins {
    id 'java'
    id 'application'
}

group 'com.sadesoft.portal'
version '0.0.0'

test {
    useJUnitPlatform()
}

sourceSets {
    main.java.srcDir("main/java")
    test.java.srcDir("test/java")
    main.resources.srcDir("main/resources")
    test.resources.srcDir("test/resources")
}

dependencies {
    implementation project(":base")
    implementation project(":core")
    implementation project(":repo")
    implementation 'io.javalin:javalin:5.1.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
}

application {
    getMainClass().set("com.sadesoft.portal.rest.Main")
}
