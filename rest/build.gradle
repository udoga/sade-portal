plugins {
    id 'java'
    id 'application'
}

group 'uds.samplepanel'
version '0.0.0'

test {
    useJUnitPlatform()
}

sourceSets {
    main.java.srcDir("main/java")
    test.java.srcDir("test/java")
    main.resources.srcDir("main/resources")
    test.resources.srcDir("test/resources")
}

dependencies {
    implementation project(":base")
    implementation project(":core")
}

application {
    getMainClass().set("uds.samplepanel.rest.Main")
}
