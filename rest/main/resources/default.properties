# H2
h2.url = jdbc:h2:mem:db
h2.initPath = h2.sql

# PostgreSQL
pg.url = jdbc:postgresql://localhost:5432/portaldb
pg.username = postgres
pg.password =
pg.driver = org.postgresql.Driver
pg.initPath = pg.sql

# OPM
opm.url = jdbc:postgresql://localhost:5432/opmtest?currentSchema=opm
opm.username = opmuser
opm.password = opmpass
opm.driver = org.postgresql.Driver
opm.initPath =

# Repo
repo = h2

# Rest
rest.path = /api
rest.port = 7000
rest.ui_external = true
rest.ui_folder = ../ui

# Session
session.session_timeout = 3600
session.authentication_enabled = true
session.salt =
