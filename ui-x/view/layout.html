<div x-data="new LayoutController(httpApi)" @resize.window="onResize()">
  <header>
    <a class="left" @click="toggleNavigation()"><i class="fas fa-bars"></i></a>
    <h1>Sade Portal</h1>
    <a class="right"><i class="fas fa-power-off"></i></a>
    <a class="right"><i class="fas fa-cog"></i></a>
  </header>
  <nav :class="{ opened: hasNavigation }">
    <a href="#/home"><i class="fa-solid fa-home"></i>Home</a>
    <a href="#/user-list"><i class="fa-solid fa-user"></i>Users</a>
    <a href="#/receipt-list"><i class="fa-solid fa-receipt"></i>Receipts</a>
  </nav>
  <main :class="{ shifted: isShifted }" @route-event.window="loadView($el, $event.detail)">
  </main>
  <div class="overlay" x-show="hasOverlay" @click="setNavigation(false)">
  </div>
</div>
