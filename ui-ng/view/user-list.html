<div ng-controller="UserListController">
  <h2>Users</h2>
  <table>
    <tr>
      <th class="narrow">Id</th>
      <th>Username</th>
      <th>Full Name</th>
      <th class="narrow last">
        <a class="green header icon button" ng-href="#!users/new"><i class="fas fa-plus"></i>New</a>
      </th>
    </tr>
    <tr ng-repeat="user in users">
      <td class="narrow">{{user.id}}</td>
      <td>{{user.username}}</td>
      <td>{{user.fullName}}</td>
      <td class="narrow last">
        <a title="Show" class="light-blue row button" ng-href="#!users/{{user.id}}">
          <i class="far fa-eye"></i>
        </a>
        <a title="Edit" class="yellow row button" ng-href="#!users/{{user.id}}/edit">
          <i class="fas fa-pencil-alt"></i>
        </a>
        <a title="Delete" class="red row button" href ng-click="delete(user.id)">
          <i class="fas fa-trash"></i>
        </a>
      </td>
    </tr>
  </table>
</div>
