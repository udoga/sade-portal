<div ng-controller="LeavePageController">
  <h2>Leave</h2>
  <div class="field">
    <label>Id:</label>
    <span>{{ leave.id }}</span>
  </div>
  <div class="field">
    <label>Person ID:</label>
    <span>{{ leave.personId }}</span>
  </div>
  <div class="field">
    <label>Leave Type:</label>
    <span>{{ leave.leaveType }}</span>
  </div>
  <div class="field">
    <label>Replacement Person Id:</label>
    <span>{{ leave.replacementPersonId }}</span>
  </div>
  <div class="field">
    <label>Start Time:</label>
    <span>{{ leave.startTime }}</span>
  </div>
  <div class="field">
    <label>End Time:</label>
    <span>{{ leave.endTime }}</span>
  </div>
  <div class="field">
    <label>Day Count:</label>
    <span>{{ leave.dayCount }}</span>
  </div>
  <div class="field">
    <label>Description:</label>
    <span>{{ leave.description }}</span>
  </div>
  <div class="field">
    <label>Status:</label>
    <span>{{ leave.status }}</span>
  </div>
</div>
