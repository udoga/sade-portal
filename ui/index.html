<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sade Portal</title>
    <link rel="icon" href="image/favicon.ico">
    <link rel="stylesheet" href="library/fontawesome/css/all.css"/>
    <link rel="stylesheet" href="style/reset.css"/>
    <link rel="stylesheet" href="style/style.css"/>
    <script src="library/angularjs/angular.min.js"></script>
    <script src="library/angularjs/angular-route.min.js"></script>
    <script src="library/fontawesome/js/all.js"></script>
    <script src="controller/expense-form-controller.js"></script>
    <script src="controller/leave-list-controller.js"></script>
    <script src="controller/leave-page-controller.js"></script>
    <script src="controller/leave-form-controller.js"></script>
    <script src="controller/expense-list-controller.js"></script>
    <script src="controller/expense-page-controller.js"></script>
    <script src="controller/layout-controller.js"></script>
    <script src="controller/person-form-controller.js"></script>
    <script src="controller/person-list-controller.js"></script>
    <script src="controller/person-page-controller.js"></script>
    <script src="controller/receipt-form-controller.js"></script>
    <script src="controller/receipt-list-controller.js"></script>
    <script src="controller/receipt-page-controller.js"></script>
    <script src="controller/user-form-controller.js"></script>
    <script src="controller/user-list-controller.js"></script>
    <script src="controller/user-page-controller.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </head>
  <body ng-app="app" ng-controller="LayoutController">
    <header>
      <a class="left" ng-click="toggleNavigation()"><i class="fas fa-bars"></i></a>
      <h1>Sade Portal</h1>
      <a class="right"><i class="fas fa-power-off"></i></a>
      <a class="right"><i class="fas fa-cog"></i></a>
    </header>
    <nav ng-class="getNavigationClass()">
      <a ng-click="navigate('home')" ng-class="getLinkClass('/home')"><i class="fas fa-home"></i>Home</a>
      <a ng-click="navigate('people')" ng-class="getLinkClass('/people')"><i class="fas fa-person"></i>People</a>
      <a ng-click="navigate('expenses')" ng-class="getLinkClass('/expenses')"><i class="fas fa-credit-card"></i>Expenses</a>
      <a ng-click="navigate('leaves')" ng-class="getLinkClass('/leaves')"><i class="fa-solid fa-umbrella-beach"></i>Leaves</a>
      <a ng-click="navigate('receipts')" ng-class="getLinkClass('/receipts')"><i class="fas fa-receipt"></i>Receipts</a>
      <a ng-click="navigate('users')" ng-class="getLinkClass('/users')"><i class="fas fa-user"></i>Users</a>
    </nav>
    <main ng-class="getMainClass()">
      <div ng-view></div>
    </main>
    <div class="overlay" ng-hide="!isOverlayVisible()" ng-click="closeNavigation()"></div>
  </body>
</html>
<i class="fa-solid fa-umbrella-beach"></i>
