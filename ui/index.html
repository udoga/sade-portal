<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sample Panel</title>
    <link rel="icon" href="image/favicon.ico">
    <link rel="stylesheet" href="library/fontawesome/css/all.css"/>
    <link rel="stylesheet" href="style/reset.css"/>
    <link rel="stylesheet" href="style/style.css"/>
    <script src="library/angularjs/angular.min.js"></script>
    <script src="library/angularjs/angular-route.min.js"></script>
    <script src="library/fontawesome/js/all.js"></script>
    <script src="controller/layout-controller.js"></script>
    <script src="controller/user-form-controller.js"></script>
    <script src="controller/user-list-controller.js"></script>
    <script src="controller/user-page-controller.js"></script>
    <script src="controller/item-form-controller.js"></script>
    <script src="controller/item-list-controller.js"></script>
    <script src="controller/item-page-controller.js"></script>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
  </head>
  <body ng-app="app" ng-controller="LayoutController">
    <header>
      <a class="left" ng-click="toggleNavigation()"><i class="fas fa-bars"></i></a>
      <h1>Sample Panel</h1>
      <a class="right"><i class="fas fa-power-off"></i></a>
      <a class="right"><i class="fas fa-cog"></i></a>
    </header>
    <nav ng-class="getNavigationClass()">
      <a ng-click="navigate('home')" ng-class="getLinkClass('/home')"><i class="fas fa-home"></i>Home</a>
      <a ng-click="navigate('users')" ng-class="getLinkClass('/users')"><i class="fas fa-user"></i>Users</a>
      <a ng-click="navigate('items')" ng-class="getLinkClass('/items')"><i class="fas fa-table"></i>Items</a>
    </nav>
    <main ng-class="getMainClass()">
      <div ng-view></div>
    </main>
    <div class="overlay" ng-hide="!isOverlayVisible()" ng-click="closeNavigation()"></div>
  </body>
</html>
