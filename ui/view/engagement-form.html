<div x-data="new EngagementFormComponent(router, engagementApi, notifier)"
     x-init="loadAll(projectApi, employeeApi, positionApi)">
    <h2>Engagement Form</h2>
    <form>
      <div class="field">
        <label class="sp">Project</label>
        <select class="sp" x-model="engagement.projectId">
          <option value="" selected>Select Project</option>
          <template x-for="p in projects" :key="p.id">
            <option :value="p.id" x-text="p.name" :selected="engagement.projectId === p.id"></option>
          </template>
        </select>
      </div>
      <div class="field">
        <label class="sp">Employee</label>
        <select class="sp" x-model="engagement.employeeId">
          <option value="" selected>Select Employee</option>
          <template x-for="e in employees" :key="e.id">
            <option :value="e.id" x-text="e.fullName" :selected="engagement.employeeId === e.id"></option>
          </template>
        </select>
      </div>
      <div class="field">
        <label class="sp">Position</label>
        <select class="sp" x-model="engagement.positionId">
          <option value="" selected>Select Position</option>
          <template x-for="p in positions" :key="p.id">
            <option :value="p.id" x-text="p.name" :selected="engagement.positionId === p.id"></option>
          </template>
        </select>
      </div>
      <div class="field">
        <label class="sp">Start Date</label>
        <input type="date" class="sp" placeholder="Start Date" x-model="engagement.startDate" />
      </div>
      <div class="field">
        <label class="sp">End Date</label>
        <input type="date" class="sp" placeholder="End Date" x-model="engagement.endDate" />
      </div>
      <div class="field">
        <label class="sp">Description</label>
        <textarea class="sp" placeholder="Description" x-model="engagement.description"></textarea>
      </div>
      <div class="field">
        <label class="sp">Status</label>
        <input type="text" class="sp" placeholder="Status" x-model="engagement.status" />
      </div>
    </form>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </div>
