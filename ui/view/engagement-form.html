<div x-data="new EngagementFormComponent(router, engagementApi, notifier)"
     x-init="loadAll(projectApi, employeeApi, positionApi)">
    <h2>Engagement Form</h2>
    <form>
      <div class="field">
        <label>Project</label>
        <select class="padded" x-model="engagement.projectId">
          <option value="" disabled selected>Select Project</option>
          <template x-for="p in projects" :key="p.id">
            <option :value="p.id" x-text="p.name" :selected="engagement.projectId === p.id"></option>
          </template>
        </select>
      </div>
      <div class="field">
        <label>Employee</label>
        <select class="padded" x-model="engagement.employeeId">
          <option value="" disabled selected>Select Employee</option>
          <template x-for="e in employees" :key="e.id">
            <option :value="e.id" x-text="e.fullName" :selected="engagement.employeeId === e.id"></option>
          </template>
        </select>
      </div>
      <div class="field">
        <label>Position</label>
        <select class="padded" x-model="engagement.positionId">
          <option value="" disabled selected>Select Position</option>
          <template x-for="p in positions" :key="p.id">
            <option :value="p.id" x-text="p.name" :selected="engagement.positionId === p.id"></option>
          </template>
        </select>
      </div>
      <div class="field">
        <label>Start Date</label>
        <input type="date" placeholder="Start Date" x-model="engagement.startDate" />
      </div>
      <div class="field">
        <label>End Date</label>
        <input type="date" placeholder="End Date" x-model="engagement.endDate" />
      </div>
      <div class="field">
        <label>Description</label>
        <input type="text" placeholder="Description" x-model="engagement.description"/>
      </div>
      <div class="field">
        <label>Status</label>
        <input list="status" placeholder="Status" x-model="engagement.status" />
        <datalist id="status">
          <option value="A">
          <option value="I">
        </datalist>
      </div>
    </form>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </div>
