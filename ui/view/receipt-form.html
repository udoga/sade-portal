<div x-data="new ReceiptFormComponent(router, receiptApi, notifier)" x-init="loadAll(receiptCategoryApi)">
  <h2>Receipt Form</h2>
  <form>
    <div class="field">
      <label>Expense Id</label>
      <input type="text" disabled placeholder="Expense Id" x-model="receipt.expenseId" />
    </div>
    <div class="field">
      <label>Receipt Date</label>
      <input type="date" placeholder="Date" x-model="receipt.receiptDate" />
    </div>
    <div class="field">
      <label>Category</label>
      <select x-model="receipt.categoryId">
        <option value="" disabled selected>Select Category</option>
        <template x-for="c in categories" :key="c.id">
          <option :value="c.id" x-text="c.name" :selected="receipt.categoryId === c.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label>Amount</label>
      <input type="number" min="0" value="0" step="0.01" placeholder="Amount" x-model="receipt.amount" />
    </div>
    <div class="field">
      <label>Currency</label>
      <input type="text" placeholder="Currency" x-model="receipt.currency" />
    </div>
    <div class="field">
      <label>Vat Rate</label>
      <input type="number" min="0" value="0" step="0.01" placeholder="Vat Rate" x-model="receipt.vatRate" />
    </div>
    <div class="field">
      <label>Description</label>
      <textarea placeholder="Description" x-model="receipt.description"></textarea>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
