<div x-data="new ReceiptFormComponent(router, receiptApi, notifier)" x-init="loadAll(receiptCategoryApi)">
  <h2>Receipt Form</h2>
  <form>
    <div class="field">
      <label class="sp">Expense Id</label>
      <input type="text" class="sp" placeholder="Expense Id" x-model="receipt.expenseId" />
    </div>
    <div class="field">
      <label class="sp">Receipt Date</label>
      <input type="date" class="sp" placeholder="Date" x-model="receipt.receiptDate" />
    </div>
    <div class="field">
      <label class="sp">Category</label>
      <select class="sp" x-model="receipt.categoryId">
        <option value="" selected>Select Category</option>
        <template x-for="c in categories" :key="c.id">
          <option :value="c.id" x-text="c.name" :selected="receipt.categoryId === c.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Amount</label>
      <input type="number" class="sp" min="0" value="0" step="0.01" placeholder="Amount" x-model="receipt.amount" />
    </div>
    <div class="field">
      <label class="sp">Currency</label>
      <input type="text" class="sp" placeholder="Currency" x-model="receipt.currency" />
    </div>
    <div class="field">
      <label class="sp">Vat Rate</label>
      <input type="number" class="sp" min="0" value="0" step="0.01" placeholder="Vat Rate" x-model="receipt.vatRate" />
    </div>
    <div class="field">
      <label class="sp">Description</label>
      <textarea class="sp" placeholder="Description" x-model="receipt.description"></textarea>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
