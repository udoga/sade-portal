<div x-data="new ClientListComponent(router, clientApi, notifier)" x-init="load()">
  <h2>Clients</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Name</th>
      <th>Sector</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/client-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="c in clients">
      <tr>
        <td x-text="c.id" class="narrow"></td>
        <td x-text="c.name"></td>
        <td x-text="c.sector.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/client-page/' + c.id">
            <i class="fas fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/client-form/' + c.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(c.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(clients)" @click="load()">Load More</a>
  </div>
</div>
