<div x-data="new ExpenseListComponent(router, expenseApi, notifier)" x-init="load('detailed')">
  <h2>Expenses</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Form Date</th>
      <th>Employee</th>
      <th>Status</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/expense-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="expense in expenses">
      <tr>
        <td x-text="expense.id" class="narrow"></td>
        <td x-text="expense.formDate"></td>
        <td x-text="expense.employee.firstName + ' ' + expense.employee.lastName"></td>
        <td x-text="expense.status"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/expense-page/' + expense.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/expense-form/' + expense.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(expense.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
