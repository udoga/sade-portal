<div x-data="new ExpenseListComponent(router, expenseApi, notifier)" x-init="loadAll(employeeApi)">
  <h2>Expenses</h2>
  <div class="field">
    <select class="sp" x-model="query.employeeId" @change="reload('detailed')">
      <option value="">All Employees</option>
      <template x-for="e in employees">
        <option :value="e.id" x-text="e.fullName" :selected="query.employeeId === e.id"></option>
      </template>
    </select>
  </div>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Form Date</th>
      <th>Employee</th>
      <th>Status</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/expense-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="e in expenses">
      <tr>
        <td x-text="e.id" class="narrow"></td>
        <td x-text="e.formDate"></td>
        <td><a class="blue" x-text="e.employee.fullName" :href="'#/employee-page/' + e.employee.id"></a></td>
        <td x-text="e.status"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/expense-page/' + e.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/expense-form/' + e.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(e.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(expenses)" @click="load('detailed')">Load More</a>
  </div>
</div>
