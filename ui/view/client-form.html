<div x-data="new ClientFormComponent(router, clientApi, notifier)" x-init="load()">
  <h2>Client Form</h2>
  <form>
    <div class="field">
      <label>Name</label>
      <input type="text" placeholder="Name" x-model="client.name" />
    </div>
    <div class="options">
      <a class="white form button" @click="quit()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
