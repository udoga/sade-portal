<div x-data="new ClientFormComponent(router, clientApi, notifier)" x-init="loadAll(sectorApi)">
  <h2>Client Form</h2>
  <form>
    <div class="field">
      <label>Name</label>
      <input type="text" placeholder="Name" x-model="client.name" />
    </div>
    <div class="field">
      <label>Sector</label>
      <select class="padded" x-model="client.sectorId">
        <option value="" selected>Select Sector</option>
        <template x-for="sector in sectors" :key="sector.id">
          <option :value="sector.id" x-text="sector.name" :selected="client.sectorId === sector.id"></option>
        </template>
      </select>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
