<div ng-controller="ItemPageController">
  <h2>Item</h2>
  <div>
    <label>Id:</label>
    <span>{{ item.id }}</span>
  </div>
  <div>
    <label>Byte Field:</label>
    <span>{{ item.byteField }}</span>
  </div>
  <div>
    <label>Short Field:</label>
    <span>{{ item.shortField }}</span>
  </div>
  <div>
    <label>Int Field:</label>
    <span>{{ item.intField }}</span>
  </div>
  <div>
    <label>Long Field:</label>
    <span>{{ item.longField }}</span>
  </div>
  <div>
    <label>Double Field:</label>
    <span>{{ item.doubleField }}</span>
  </div>
  <div>
    <label>Float Field:</label>
    <span>{{ item.floatField }}</span>
  </div>
  <div>
    <label>Decimal Field:</label>
    <span>{{ item.decimalField }}</span>
  </div>
  <div>
    <label>Boolean Field:</label>
    <span>{{ item.booleanField }}</span>
  </div>
  <div>
    <label>Char Field:</label>
    <span>{{ item.charField }}</span>
  </div>
  <div>
    <label>String Field:</label>
    <span>{{ item.stringField }}</span>
  </div>
  <div>
    <label>Date Field:</label>
    <span>{{ item.dateField }}</span>
  </div>
  <div>
    <label>Enum Field:</label>
    <span>{{ item.enumField }}</span>
  </div>
</div>
