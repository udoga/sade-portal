<div x-data="new ClientPageComponent(router, clientApi, notifier)" x-init="load()">
  <h2>Client</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="client.id"></span>
    </div>
    <div class="field">
      <label>Name:</label>
      <span x-text="client.name"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/client-list">Back</a>
      <a class="yellow form button" :href="'#/client-form/' + client.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
