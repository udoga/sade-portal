<div x-data="new EmployeePageComponent(router, employeeApi, notifier)" x-init="loadDetailed()">
  <h2>Employee</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="employee.id"></span>
    </div>
    <div class="field">
      <label>User:</label>
      <a class="blue" x-text="getUser().username" :href="'#/user-page/' + employee.userId"></a>
    </div>
    <div class="field">
      <label>First Name:</label>
      <span x-text="employee.firstName"></span>
    </div>
    <div class="field">
      <label>Last Name:</label>
      <span x-text="employee.lastName"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="selectTab('user')" :class="getTabClass('user')">User</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelectedTab('user')">
          <div class="field">
            <label>User Id:</label>
            <span x-text="getUser().id"></span>
          </div>
          <div class="last field">
            <label>Username:</label>
            <span x-text="getUser().username"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="yellow form button" :href="'#/employee-form/' + employee.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
