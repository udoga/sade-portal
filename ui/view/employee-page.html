<div x-data="new EmployeePageComponent(router, employeeApi, notifier)" x-init="load()">
  <h2>Employee</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="employee.id"></span>
    </div>
    <div class="field">
      <label>User Id:</label>
      <span x-text="employee.userId"></span>
    </div>
    <div class="field">
      <label>First Name:</label>
      <span x-text="employee.firstName"></span>
    </div>
    <div class="field">
      <label>Last Name:</label>
      <span x-text="employee.lastName"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/employee-list">Back</a>
      <a class="yellow form button" :href="'#/employee-form/' + employee.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
