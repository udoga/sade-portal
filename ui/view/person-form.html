<div ng-controller="PersonFormController">
  <h2>Person Form</h2>
  <form>
    <div class="field">
      <label>First Name</label>
      <input type="text" placeholder="First Name" ng-model="person.firstName"/>
    </div>
    <div class="field">
      <label>Last Name</label>
      <input type="text" placeholder="Last Name" ng-model="person.lastName"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="Email" ng-model="person.email"/>
    </div>
    <div class="field">
      <label>Work Email</label>
      <input type="email" placeholder="Work Email" ng-model="person.workEmail"/>
    </div>
    <div class="field">
      <label>Mobile Phone</label>
      <input type="tel" placeholder="Mobile Phone" ng-model="person.mobilePhone"/>
    </div>
    <div class="field">
      <label>Work Phone</label>
      <input type="tel" placeholder="Work Phone" ng-model="person.workPhone"/>
    </div>
    <div class="field">
      <label>Employment Start Date</label>
      <input type="date" placeholder="Employment Start Date" ng-model="person.employmentStartDate"/>
    </div>
    <div class="field">
      <label>Contract End Date</label>
      <input type="date" placeholder="Contract End Date" ng-model="person.contractEndDate"/>
    </div>
    <div class="field">
      <label>Access Type</label>
      <input list="accesstype" placeholder="Access Type" ng-model="person.accessType"/>
      <datalist id="accesstype">
        <option>Employee</option>
        <option>Manager</option>
        <option>Owner</option>
      </datalist>
    </div>
    <div class="field">
      <label>Birthday</label>
      <input type="date" placeholder="Birthday" ng-model="person.birthday"/>
    </div>
    <div class="field">
      <label>Blood Type</label>
      <input list="bloodtype" placeholder="Blood Type" ng-model="person.bloodType"/>
      <datalist id="bloodtype">
        <option>ANegative</option>
        <option>APositive</option>
        <option>ZeroPositive</option>
        <option>ZeroNegative</option>
        <option>ABNegative</option>
        <option>ABPositive</option>
        <option>BNegative</option>
        <option>BPositive</option>
      </datalist>
    </div>
    <div class="field">
      <label>Education Level</label>
      <input list="educationlevel" placeholder="Education Level" ng-model="person.educationLevel"/>
      <datalist id="educationlevel">
        <option>Primary</option>
        <option>Secondary</option>
        <option>High_School</option>
        <option>Associate</option>
        <option>Bachelor</option>
        <option>Master</option>
        <option>None</option>
      </datalist>
    </div>
    <div class="field">
      <label>Graduated</label>
      <input type="checkbox" placeholder="Graduated" ng-model="person.graduated"/>
    </div>
    <div class="field">
      <label>Educational Institution</label>
      <input type="text" placeholder="Educational Institution" ng-model="person.educationalInstitution"/>
    </div>
    <div class="field">
      <label>Gender</label>
      <input list="gender" placeholder="Gender" ng-model="person.gender"/>
      <datalist id="gender">
        <option value="Female">
        <option value="Male">
        <option value="Unspecified">
      </datalist>
    </div>
    <div class="field">
      <label>Id Number</label>
      <input type="text" min="0" placeholder="Id Number" ng-model="person.idNumber"/>
    </div>
    <div class="field">
      <label>Level of Disability</label>
      <input list="levelofdisability" placeholder="Level of Disability" ng-model="person.levelOfDisability"/>
      <datalist id="levelofdisability">
        <option value="NotDisabled">
        <option value="ThirdLevel">
        <option value="SecondLevel">
        <option value="FirstLevel">
      </datalist>
    </div>
    <div class="field">
      <label>Marital Status</label>
      <input list="maritalstatus" placeholder="Marital Status" ng-model="person.maritalStatus"/>
      <datalist id="maritalstatus">
        <option value="Married">
        <option value="Single">
        <option value="Divorced">
        <option value="Unspecified">
      </datalist>
    </div>
    <div class="field">
      <label>Partner Work Status</label>
      <input type="checkbox" placeholder="Partner Work Status" ng-model="person.partnerWorkStatus"/>
    </div>
    <div class="field">
      <label>Military Service</label>
      <input list="militaryservice" placeholder="Military Service" ng-model="person.militaryService"/>
      <datalist id="militaryservice">
        <option value="Completed">
        <option value="Uncompleted">
        <option value="Deserter">
        <option value="Exempt">
        <option value="Delayed">
      </datalist>
    </div>
    <div class="field">
      <label>Military Service Delay Date</label>
      <input type="date" placeholder="Military Service Delay Date" ng-model="person.militaryServiceDelayDate"/>
    </div>
    <div class="field">
      <label>Nationality</label>
      <input list="nationality" placeholder="Nationality" ng-model="person.nationality"/>
      <datalist id="nationality">
        <option value="TR">
        <option value="US">
        <option value="GB">
        <option value="MT">
        <option value="PL">
      </datalist>
    </div>
    <div class="field">
      <label>Number of Children</label>
      <input type="number" min="0" placeholder="Number of Children" ng-model="person.numberOfChildren"/>
    </div>
    <div class="field">
      <label>Tour Status</label>
      <input list="tourstatus" placeholder="Tour Status" ng-model="person.tourStatus"/>
      <datalist id="tourstatus">
        <option value="Completed">
        <option value="Canceled">
        <option value="Active">
        <option value="Passive">
      </datalist>
    </div>
    <div class="options">
      <a class="white form button" href="#!people">Back</a>
      <a class="green form button" href ng-click="save()">Save</a>
    </div>
  </form>
</div>
