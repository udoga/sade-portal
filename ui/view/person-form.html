<div ng-controller="PersonFormController">
  <h2>Person Form</h2>
  <form>
    <div class="field">
      <label>First Name</label>
      <input type="text" placeholder="First Name" ng-model="person.firstName"/>
    </div>
    <div class="field">
      <label>Last Name</label>
      <input type="text" placeholder="Last Name" ng-model="person.lastName"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="text" placeholder="Email" ng-model="person.email"/>
    </div>
    <div class="field">
      <label>Work Email</label>
      <input type="text" placeholder="Work Email" ng-model="person.workEmail"/>
    </div>
    <div class="field">
      <label>Mobile Phone</label>
      <input type="text" placeholder="Mobile Phone" ng-model="person.mobilePhone"/>
    </div>
    <div class="field">
      <label>Work Phone</label>
      <input type="text" placeholder="Work Phone" ng-model="person.mobilePhone"/>
    </div>
    <div class="field">
      <label>Employment Start Date</label>
      <input type="text" placeholder="Employment Start Date" ng-model="person.employmentStartDate"/>
    </div>
    <div class="field">
      <label>Contract Type</label>
      <input type="text" placeholder="Contract Type" ng-model="person.contractType"/>
    </div>
    <div class="field">
      <label>Contract End Date</label>
      <input type="text" placeholder="Contract End Date" ng-model="person.contractEndDate"/>
    </div>
    <div class="field">
      <label>Working Day Id</label>
      <input type="text" placeholder="Working Day Id" ng-model="person.workingDayId"/>
    </div>
    <div class="field">
      <label>Access Type</label>
      <input type="text" placeholder="Access Type" ng-model="person.accessType"/>
    </div>
    <div class="field">
      <label>Birthday</label>
      <input type="text" placeholder="Birthday" ng-model="person.birthday"/>
    </div>
    <div class="field">
      <label>Blood Type</label>
      <input type="text" placeholder="Blood Type" ng-model="person.bloodType"/>
    </div>
    <div class="field">
      <label>Educational Level</label>
      <input type="text" placeholder="Educational Level" ng-model="person.educationalLevel"/>
    </div>
    <div class="field">
      <label>Education Status</label>
      <input type="text" placeholder="Education Status" ng-model="person.educationStatus"/>
    </div>
    <div class="field">
      <label>Educational Institution</label>
      <input type="text" placeholder="Educational Institution" ng-model="person.educationalInstitution"/>
    </div>
    <div class="field">
      <label>Gender</label>
      <input type="text" placeholder="Gender" ng-model="person.gender"/>
    </div>
    <div class="field">
      <label>Id Number</label>
      <input type="text" placeholder="Id Number" ng-model="person.idNumber"/>
    </div>
    <div class="field">
      <label>Level of Disability</label>
      <input type="text" placeholder="Level of Disability" ng-model="person.levelOfDisability"/>
    </div>
    <div class="field">
      <label>Marital Status</label>
      <input type="text" placeholder="Marital Status" ng-model="person.maritalStatus"/>
    </div>
    <div class="field">
      <label>Partner Work Status</label>
      <input type="text" placeholder="Partner Work Status" ng-model="person.partnerWorkStatus"/>
    </div>
    <div class="field">
      <label>Military Service</label>
      <input type="text" placeholder="Military Service" ng-model="person.militaryService"/>
    </div>
    <div class="field">
      <label>Military Service Delay Date</label>
      <input type="text" placeholder="Military Service Delay Date" ng-model="person.militaryServiceDelayDate"/>
    </div>
    <div class="field">
      <label>Nationality</label>
      <input type="text" placeholder="Nationality" ng-model="person.nationality"/>
    </div>
    <div class="field">
      <label>Number of Children</label>
      <input type="text" placeholder="Number of Children" ng-model="person.numberOfChildren"/>
    </div>
    <div class="field">
      <label>Tour Status</label>
      <input type="text" placeholder="Tour Status" ng-model="person.tourStatus"/>
    </div>
    <div class="options">
      <a class="white form button" href="#!people">Back</a>
      <a class="green form button" href ng-click="save()">Save</a>
    </div>
  </form>
</div>
