<div x-data="new LeavePageComponent(router, leaveClient)" x-init="load()">
  <h2>Leave</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="leave.id"></span>
    </div>
    <div class="field">
      <label>User ID:</label>
      <span x-text="leave.userId"></span>
    </div>
    <div class="field">
      <label>Leave Type:</label>
      <span x-text="leave.leaveType"></span>
    </div>
    <div class="field">
      <label>Replacement User Id:</label>
      <span x-text="leave.replacementUserId"></span>
    </div>
    <div class="field">
      <label>Start Time:</label>
      <span x-text="leave.startTime"></span>
    </div>
    <div class="field">
      <label>End Time:</label>
      <span x-text="leave.endTime"></span>
    </div>
    <div class="field">
      <label>Day Count:</label>
      <span x-text="leave.dayCount"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="leave.description"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="leave.status"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/leave-list">Back</a>
      <a class="yellow form button" :href="'#/leave-form/' + leave.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
