<div x-data="new VacationPageComponent(router, vacationApi, notifier, formatter)" x-init="loadDetailed()">
  <h2>Vacation</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="vacation.id"></span>
    </div>
    <div class="field">
      <label>Employee Id:</label>
      <span x-text="vacation.employeeId"></span>
    </div>
    <div class="field">
      <label>Category Id:</label>
      <span x-text="vacation.categoryId"></span>
    </div>
    <div class="field">
      <label>Start Time:</label>
      <span x-text="formatter.formatTime(vacation.startTime)"></span>
    </div>
    <div class="field">
      <label>End Time:</label>
      <span x-text="formatter.formatTime(vacation.endTime)"></span>
    </div>
    <div class="field">
      <label>Day Count:</label>
      <span x-text="vacation.dayCount"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="vacation.description"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="vacation.status"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="selectTab('employee')" :class="getTabClass('employee')">Employee</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelectedTab('employee')">
          <div class="field">
            <label>Employee Id:</label>
            <span x-text="getEmployee().id"></span>
          </div>
          <div class="last field">
            <label>Employee Name:</label>
            <span x-text="getEmployee().firstName + ' ' + getEmployee().lastName"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="yellow form button" :href="'#/vacation-form/' + vacation.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
