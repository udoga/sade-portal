<div x-data="new VacationPageComponent(router, vacationClient, notifier)" x-init="load()">
  <h2>Vacation</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="vacation.id"></span>
    </div>
    <div class="field">
      <label>Employee Id:</label>
      <span x-text="vacation.employeeId"></span>
    </div>
    <div class="field">
      <label>Vacation Type:</label>
      <span x-text="vacation.vacationType"></span>
    </div>
    <div class="field">
      <label>Replacement Employee Id:</label>
      <span x-text="vacation.replacementEmployeeId"></span>
    </div>
    <div class="field">
      <label>Start Time:</label>
      <span x-text="vacation.startTime"></span>
    </div>
    <div class="field">
      <label>End Time:</label>
      <span x-text="vacation.endTime"></span>
    </div>
    <div class="field">
      <label>Day Count:</label>
      <span x-text="vacation.dayCount"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="vacation.description"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="vacation.status"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/vacation-list">Back</a>
      <a class="yellow form button" :href="'#/vacation-form/' + vacation.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
