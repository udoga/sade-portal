<div x-data="new SessionListComponent(sessionClient, notifier)" x-init="loadAll(userClient)">
  <h2>Sessions</h2>
  <table>
    <tr>
      <th class="narrow">Id</th>
      <th>Username</th>
      <th>Begin Time</th>
      <th>End Time</th>
      <th class="narrow last">
      </th>
    </tr>
    <template x-for="session in sessions">
      <tr>
        <td x-text="session.id" class="narrow"></td>
        <td x-text="getUsername(session.userId)"></td>
        <td x-text="session.beginTime"></td>
        <td x-text="session.endTime"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/session-page/' + session.id">
            <i class="fas fa-eye"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
