<div x-data="new WorklogListComponent(router, worklogApi, notifier)" x-init="loadAll(employeeApi, projectApi)">
  <h2>Worklogs</h2>
  <div class="field">
    <select class="sp" x-model="query.employeeId" @change="reload()">
      <option value="">All Employees</option>
      <template x-for="e in employees">
        <option :value="e.id" x-text="e.fullName" :selected="query.employeeId === e.id"></option>
      </template>
    </select>
    <select class="sp next" x-model="query.projectId" @change="reload()">
      <option value="">All Projects</option>
      <template x-for="p in projects">
        <option :value="p.id" x-text="p.name" :selected="query.projectId === p.id"></option>
      </template>
    </select>
    <input type="text" class="sp next" placeholder="Start Date" x-model="query.minDate"
           x-init="initDatePicker($el)" @change="reload()" />
    <input type="text" class="sp next" placeholder="End Date" x-model="query.maxDate"
           x-init="initDatePicker($el)" @change="reload()" />
    <select class="sp next" x-model="query.order" @change="reload()">
      <option value="" disabled>Sort</option>
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
    </select>
  </div>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Work Date</th>
      <th>Project</th>
      <th>Employee</th>
      <th>Activity</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/worklog-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="w in worklogs">
      <tr>
        <td x-text="w.id" class="narrow"></td>
        <td x-text="w.workDate"></td>
        <td><a class="blue" x-text="w.project.name" :href="'#/project-page/' + w.project.id"></a></td>
        <td><a class="blue" x-text="w.employee.fullName" :href="'#/employee-page/' + w.employee.id"></a></td>
        <td x-text="w.activity.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/worklog-page/' + w.id">
            <i class="fas fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/worklog-form/' + w.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(w.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(worklogs)" @click="load()">Load More</a>
  </div>
</div>
