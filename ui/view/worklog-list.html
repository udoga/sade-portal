<div x-data="new WorklogListComponent(router, worklogApi, notifier)" x-init="loadAll(employeeApi)">
  <h2>Worklogs</h2>
  <div class="query">
    <select class="padded" x-model="query.employeeId" @change="reload('detailed')">
      <option value="" selected>Select Employee</option>
      <template x-for="e in employees" :key="e.id">
        <option :value="e.id" x-text="getFullName(e)" :selected="query.employeeId === e.id"></option>
      </template>
    </select>
  </div>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Work Date</th>
      <th>Project</th>
      <th>Employee</th>
      <th>Activity</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/worklog-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="worklog in worklogs">
      <tr>
        <td x-text="worklog.id" class="narrow"></td>
        <td x-text="worklog.workDate"></td>
        <td x-text="worklog.project.name"></td>
        <td x-text="worklog.employee.firstName + ' ' + worklog.employee.lastName"></td>
        <td x-text="worklog.activity.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/worklog-page/' + worklog.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/worklog-form/' + worklog.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(worklog.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore()" @click="loadMore()">Load More</a>
  </div>
</div>
