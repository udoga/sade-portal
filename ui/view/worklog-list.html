<div x-data="new WorklogListComponent(router, worklogApi, notifier)" x-init="loadAll(employeeApi, projectApi)">
  <h2>Worklogs</h2>
  <div class="query">
    <select class="padded left" x-model="query.employeeId" @change="reload('detailed')">
      <option value="">All Employees</option>
      <template x-for="e in employees">
        <option :value="e.id" x-text="getFullName(e)" :selected="query.employeeId === e.id"></option>
      </template>
    </select>
    <select class="padded left" x-model="query.projectId" @change="reload('detailed')">
      <option value="">All Projects</option>
      <template x-for="p in projects">
        <option :value="p.id" x-text="p.name" :selected="query.projectId === p.id"></option>
      </template>
    </select>
    <input type="text" id="minDate" x-model="query.minDate" placeholder="Start Date" class="sp"
      x-init="initDatePicker($el)" @change="reload('detailed')" />
    <input type="text" id="maxDate" x-model="query.maxDate" placeholder="End Date" class="sp"
      x-init="initDatePicker($el)" @change="reload('detailed')" />
    <select class="padded right" x-model="query.order" @change="reload('detailed')">
      <option value="" disabled>Sort</option>
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
    </select>
  </div>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Work Date</th>
      <th>Project</th>
      <th>Employee</th>
      <th>Activity</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/worklog-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="worklog in worklogs">
      <tr>
        <td x-text="worklog.id" class="narrow"></td>
        <td x-text="worklog.workDate"></td>
        <td x-text="worklog.project.name"></td>
        <td x-text="worklog.employee.firstName + ' ' + worklog.employee.lastName"></td>
        <td x-text="worklog.activity.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/worklog-page/' + worklog.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/worklog-form/' + worklog.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(worklog.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(worklogs)" @click="load('detailed')">Load More</a>
  </div>
</div>
