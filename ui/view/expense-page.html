<div x-data="new ExpensePageComponent(router, expenseClient, notifier)" x-init="load()">
  <h2>Expense</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="expense.id"></span>
    </div>
    <div class="field">
      <label>User Id:</label>
      <span x-text="expense.userId"></span>
    </div>
    <div class="field">
      <label>Form Date:</label>
      <span x-text="expense.formDate"></span>
    </div>
    <div class="field">
      <label>Amount:</label>
      <span x-text="expense.amount"></span>
    </div>
    <div class="field">
      <label>Currency:</label>
      <span x-text="expense.currency"></span>
    </div>
    <div class="field">
      <label>Paid:</label>
      <span x-text="expense.paid"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="expense.description"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="expense.status"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/expense-list">Back</a>
      <a class="yellow form button" :href="'#/expense-form/' + expense.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
