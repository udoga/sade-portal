<div x-data="new ExpensePageComponent(router, expenseApi, notifier, receiptApi)" x-init="load()">
  <h2>Expense</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="expense.id"></span>
    </div>
    <div class="field">
      <label>Employee Id:</label>
      <span x-text="expense.employeeId"></span>
    </div>
    <div class="field">
      <label>Form Date:</label>
      <span x-text="expense.formDate"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="expense.description"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="expense.status"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="select('receipts')" :class="getClass('receipts')">Receipts</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelected('receipts')">
          <table class="relations">
            <tr>
              <th class="narrow">Receipt Id</th>
              <th>Receipt Date</th>
              <th>Category Id</th>
              <th>Amount</th>
              <th>Currency</th>
              <th>Vat Rate</th>
              <th></th>
            </tr>
            <template x-for="r in receipts">
              <tr>
                <td x-text="r.id" class="narrow"></td>
                <td x-text="r.receiptDate"></td>
                <td x-text="r.categoryId"></td>
                <td x-text="r.amount"></td>
                <td x-text="r.currency"></td>
                <td x-text="r.vatRate"></td>
                <td class="narrow">
                  <a title="Delete" class="red row button" @click="removeReceipt(r.id)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
              </tr>
            </template>
          </table>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="#/expense-list">Back</a>
      <a class="yellow form button" :href="'#/expense-form/' + expense.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
