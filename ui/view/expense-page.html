<div x-data="new ExpensePageComponent(router, expenseApi, notifier, receiptApi)" x-init="loadDetailed()">
  <h2>Expense</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="expense.id"></span>
    </div>
    <div class="field">
      <label>Employee:</label>
      <a class="blue" x-text="getEmployee().fullName" :href="'#/employee-page/' + expense.employeeId"></a>
    </div>
    <div class="field">
      <label>Form Date:</label>
      <span x-text="expense.formDate"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="expense.description"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="expense.status"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="selectTab('receipts')" :class="getTabClass('receipts')">Receipts</span>
        <span class="panel-item" @click="selectTab('employee')" :class="getTabClass('employee')">Employee</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelectedTab('receipts')">
          <table class="relations">
            <tr>
              <th class="narrow">Receipt Id</th>
              <th>Receipt Date</th>
              <th>Category Id</th>
              <th>Amount</th>
              <th>Description</th>
              <th class="last narrow">
                <a class="green header icon button" :href="'#/receipt-form?expenseId=' + expense.id">
                  <i class="fas fa-plus"></i> New
                </a>
              </th>
            </tr>
            <template x-for="r in receipts">
              <tr>
                <td class="narrow" x-text="r.id"></td>
                <td x-text="r.receiptDate"></td>
                <td x-text="r.categoryId"></td>
                <td x-text="r.amount + ' ' + r.currency + ' + VAT (' + r.vatRate + '%)'"></td>
                <td x-text="r.description"></td>
                <td class="last narrow">
                  <a title="Edit" class="yellow row button" :href="'#/receipt-form/' + r.id">
                    <i class="fas fa-pencil"></i>
                  </a>
                  <a title="Delete" class="red row button" @click="removeReceipt(r.id)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
              </tr>
            </template>
          </table>
          <div class="options">
            <a class="white form button" x-show="hasMore(receipts)" @click="loadReceipts()">Load More</a>
          </div>
        </div>
        <div x-show="isSelectedTab('employee')">
          <div class="field">
            <label>Employee Id:</label>
            <span x-text="getEmployee().id"></span>
          </div>
          <div class="last field">
            <label>Employee Name:</label>
            <span x-text="getEmployee().fullName"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="yellow form button" :href="'#/expense-form/' + expense.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
