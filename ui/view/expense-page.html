<div ng-controller="ExpensePageController">
  <h2>Expense</h2>
  <div class="field">
    <label>Id:</label>
    <span>{{ expense.id }}</span>
  </div>
  <div class="field">
    <label>Person Id:</label>
    <span>{{ expense.personId }}</span>
  </div>
  <div class="field">
    <label>Form Date:</label>
    <span>{{ expense.formDate }}</span>
  </div>
  <div class="field">
    <label>Amount:</label>
    <span>{{ expense.amount }}</span>
  </div>
  <div class="field">
    <label>Currency:</label>
    <span>{{ expense.currency }}</span>
  </div>
  <div class="field">
    <label>Paid:</label>
    <span>{{ expense.paid }}</span>
  </div>
  <div class="field">
    <label>Description:</label>
    <span>{{ expense.description }}</span>
  </div>
  <div class="field">
    <label>Status:</label>
    <span>{{ expense.status }}</span>
  </div>
</div>
