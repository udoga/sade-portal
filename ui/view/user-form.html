<div ng-controller="UserFormController">
  <h2>User Form</h2>
  <form>
    <div class="field">
      <label>Username</label>
      <input type="text" placeholder="Username" ng-model="user.username"/>
    </div>
    <div class="field">
      <label>Full Name</label>
      <input type="text" placeholder="Full Name" ng-model="user.fullName"/>
    </div>
    <div class="options">
      <a class="white form button" href="#!users">Back</a>
      <a class="green form button" href ng-click="save()">Save</a>
    </div>
  </form>
</div>
