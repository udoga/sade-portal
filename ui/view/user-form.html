<div x-data="new UserFormComponent(router, userClient, notifier)">
    <h2>User Form</h2>
    <form @user-event.window="user = $event.detail">
        <div class="field">
            <label>Username</label>
            <input type="text" placeholder="Username" x-model="user.username"/>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="text" placeholder="Password" x-model="user.password"/>
        </div>
    </form>
    <div class="options">
        <a class="white form button" @click="quit()">Back</a>
        <a class="green form button" @click="save()">Save</a>
    </div>
</div>
