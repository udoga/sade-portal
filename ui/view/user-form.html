<div x-data="new UserFormComponent(router, userApi, notifier)" x-init="load()">
  <h2>User Form</h2>
  <form>
    <div class="field">
      <label class="sp">Username</label>
      <input type="text" class="sp" placeholder="Username" x-model="user.username"/>
    </div>
    <div class="field">
      <label class="sp">Password</label>
      <input type="password" class="sp" placeholder="Password" autocomplete="new-password" x-model="user.password"/>
    </div>
    <div class="field">
      <label class="sp">Retype Password</label>
      <input type="password" class="sp" placeholder="Password" autocomplete="new-password" x-model="retypedPassword"/>
    </div>
  </form>
  <div class="options">
    <a class="white form button" href="javascript:history.back()">Back</a>
    <a class="green form button" @click="check()">Save</a>
  </div>
</div>
