<div x-data="new WorklogFormComponent(router, worklogApi, notifier)"
  x-init="loadAll(projectApi, employeeApi, activityApi)">
  <h2>Worklog Form</h2>
  <form>
    <div class="field">
      <label class="sp">Project</label>
      <select class="sp" x-model="worklog.projectId">
        <option value="" selected>Select Project</option>
        <template x-for="p in projects" :key="p.id">
          <option :value="p.id" x-text="p.name" :selected="worklog.projectId === p.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Employee</label>
      <select class="sp" x-model="worklog.employeeId">
        <option value="" selected>Select Employee</option>
        <template x-for="e in employees" :key="e.id">
          <option :value="e.id" x-text="e.fullName" :selected="worklog.employeeId === e.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Activity</label>
      <select class="sp" x-model="worklog.activityId">
        <option value="" selected>Select Activity</option>
        <template x-for="a in activities" :key="a.id">
          <option :value="a.id" x-text="a.name" :selected="worklog.activityId === a.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Work Date</label>
      <input type="date" class="sp" placeholder="Work Date" x-model="worklog.workDate" />
    </div>
    <div class="field">
      <label class="sp">Duration</label>
      <input type="text" class="sp" placeholder="Duration" x-model="worklog.duration" />
    </div>
    <div x-show="router.getId()" class="field">
      <label class="sp">Status</label>
      <select class="sp" x-model="worklog.status" x-effect="worklog.status ||= null">
        <option value=''>Pending</option>
        <option value="A">Approved</option>
        <option value="D">Denied</option>
      </select>
    </div>
    <div class="field">
      <label class="sp">Description</label>
      <textarea class="sp" placeholder="Description" x-model="worklog.description"></textarea>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
