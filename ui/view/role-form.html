<div x-data="new RoleFormComponent(router, roleApi, notifier)" x-init="load()">
  <h2>Role Form</h2>
  <form>
    <div class="field">
      <label>Name</label>
      <input type="text" placeholder="Name" x-model="role.name" />
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
