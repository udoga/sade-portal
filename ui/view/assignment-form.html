<div x-data="new AssignmentFormComponent(router, assignmentApi, notifier)" x-init="loadAll(userApi, roleApi)">
  <h2>Assignment Form</h2>
  <form>
    <div class="field">
      <label>User</label>
      <select x-model="assignment.userId">
        <option value="" disabled selected>Select User</option>
        <template x-for="u in users" :key="u.id">
          <option :value="u.id" x-text="u.username" :selected="assignment.userId === u.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label>Role</label>
      <select x-model="assignment.roleId">
        <option value="" disabled selected>Select Role</option>
        <template x-for="r in roles" :key="r.id">
          <option :value="r.id" x-text="r.name" :selected="assignment.roleId === r.id"></option>
        </template>
      </select>
    </div>
  <div class="options">
    <a class="white form button" href="javascript:history.back()">Back</a>
    <a class="green form button" @click="save()">Save</a>
  </div>
</div>
