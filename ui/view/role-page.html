<div x-data="new RolePageComponent(router, roleApi, notifier, assignmentApi, grantApi)" x-init="load()">
  <h2>Role</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="role.id"></span>
    </div>
    <div class="field">
      <label>Name:</label>
      <span x-text="role.name"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="selectTab('assignments')" :class="getTabClass('assignments')">Users</span>
        <span class="panel-item" @click="selectTab('grants')" :class="getTabClass('grants')">Permissions</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelectedTab('assignments')">
          <table class="relations">
            <tr>
              <th class="narrow">User Id</th>
              <th>Username</th>
              <th class="last narrow">
                <a class="green header icon button" :href="'#/assignment-form?roleId=' + role.id">
                  <i class="fas fa-plus"></i> New
                </a>
              </th>
            </tr>
            <template x-for="a in assignments">
              <tr>
                <td x-text="a.user.id" class="narrow"></td>
                <td x-text="a.user.username"></td>
                <td class="last narrow">
                  <a title="Delete" class="red row button" @click="removeAssignment(a.id)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
              </tr>
            </template>
          </table>
        </div>
        <div x-show="isSelectedTab('grants')">
          <table class="relations">
            <tr>
              <th class="narrow">Permission Id</th>
              <th>Permission Name</th>
              <th class="last narrow">
                <a class="green header icon button" :href="'#/grant-form?roleId=' + role.id">
                  <i class="fas fa-plus"></i> New
                </a>
              </th>
            </tr>
            <template x-for="g in grants">
              <tr>
                <td x-text="g.permission.id" class="narrow"></td>
                <td x-text="g.permission.name"></td>
                <td class="last narrow">
                  <a title="Delete" class="red row button" @click="removeGrant(g.id)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
              </tr>
            </template>
          </table>
          <div class="options">
            <a class="white form button" x-show="hasMoreGrants()" @click="loadGrants()">Load More</a>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="yellow form button" :href="'#/role-form/' + role.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
