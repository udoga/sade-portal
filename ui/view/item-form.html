<div ng-controller="ItemFormController">
  <h2>Item Form</h2>
  <form>
    <div class="field">
      <label>Byte Field</label>
      <input type="text" placeholder="Byte Field" ng-model="item.byteField"/>
    </div>
    <div class="field">
      <label>Short Field</label>
      <input type="text" placeholder="Short Field" ng-model="item.shortField"/>
    </div>
    <div class="field">
      <label>Int Field</label>
      <input type="text" placeholder="Int Field" ng-model="item.intField"/>
    </div>
    <div class="field">
      <label>Long Field</label>
      <input type="text" placeholder="Long Field" ng-model="item.longField"/>
    </div>
    <div class="field">
      <label>Double Field</label>
      <input type="text" placeholder="Double Field" ng-model="item.doubleField"/>
    </div>
    <div class="field">
      <label>Float Field</label>
      <input type="text" placeholder="Float Field" ng-model="item.floatField"/>
    </div>
    <div class="field">
      <label>Decimal Field</label>
      <input type="text" placeholder="Decimal Field" ng-model="item.decimalField"/>
    </div>
    <div class="field">
      <label>Boolean Field</label>
      <input type="text" placeholder="Boolean Field" ng-model="item.booleanField"/>
    </div>
    <div class="field">
      <label>Char Field</label>
      <input type="text" placeholder="Char Field" ng-model="item.charField"/>
    </div>
    <div class="field">
      <label>String Field</label>
      <input type="text" placeholder="String Field" ng-model="item.stringField"/>
    </div>
    <div class="field">
      <label>Date Field</label>
      <input type="text" placeholder="Date Field" ng-model="item.dateField"/>
    </div>
    <div class="field">
      <label>Enum Field</label>
      <input type="text" placeholder="Enum Field" ng-model="item.enumField"/>
    </div>
    <div class="options">
      <a class="white form button" href="#!items">Back</a>
      <a class="green form button" href ng-click="save()">Save</a>
    </div>
  </form>
</div>
