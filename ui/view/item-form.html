<div ng-controller="ItemFormController">
  <h2>Item Form</h2>
  <form>
    <div>
      <label>Byte Field</label>
      <input type="text" ng-model="item.byteField"/>
    </div>
    <div>
      <label>Short Field</label>
      <input type="text" ng-model="item.shortField"/>
    </div>
    <div>
      <label>Int Field</label>
      <input type="text" ng-model="item.intField"/>
    </div>
    <div>
      <label>Long Field</label>
      <input type="text" ng-model="item.longField"/>
    </div>
    <div>
      <label>Double Field</label>
      <input type="text" ng-model="item.doubleField"/>
    </div>
    <div>
      <label>Float Field</label>
      <input type="text" ng-model="item.floatField"/>
    </div>
    <div>
      <label>Decimal Field</label>
      <input type="text" ng-model="item.decimalField"/>
    </div>
    <div>
      <label>Boolean Field</label>
      <input type="text" ng-model="item.booleanField"/>
    </div>
    <div>
      <label>Char Field</label>
      <input type="text" ng-model="item.charField"/>
    </div>
    <div>
      <label>String Field</label>
      <input type="text" ng-model="item.stringField"/>
    </div>
    <div>
      <label>Date Field</label>
      <input type="text" ng-model="item.dateField"/>
    </div>
    <div>
      <a href="#!items">Cancel</a>
      <a href ng-click="save()">Save</a>
    </div>
  </form>
</div>
