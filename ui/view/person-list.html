<div x-data="new PersonListController(personApi)">
    <h2>People</h2>
    <div class="error-alert" @error-event.window="error = $event.detail" x-text="error.message"></div>
    <table>
        <tr>
            <th class="narrow">Id</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Access Type</th>
            <th>Work Email</th>
            <th>Mobile Phone</th>
            <th class="narrow last">
                <a class="green header icon button" href="#/person-form"><i class="fas fa-plus"></i>New</a>
            </th>
        </tr>
        <template x-for="person in people" @people-event.window="people = $event.detail">
        <tr>
            <td x-text="person.id" class="narrow"></td>
            <td x-text="person.firstName"></td>
            <td x-text="person.lastName"></td>
            <td x-text="person.accessType"></td>
            <td x-text="person.workEmail"></td>
            <td x-text="person.mobilePhone"></td>
            <td class="narrow last">
                <a title="Show" class="light-blue row button" :href="'#/person-page/' + person.id">
                    <i class="far fa-eye"></i>
                </a>
                <a title="Edit" class="yellow row button" :href="'#/person-form/' + person.id">
                    <i class="fas fa-pencil-alt"></i>
                </a>
                <a title="Delete" class="red row button" @click="remove(person.id)">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
        </template>
    </table>
</div>
