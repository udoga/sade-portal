<div x-data="new VacationListComponent(router, vacationApi, notifier, formatter)" x-init="load()">
  <h2>Vacations</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Employee</th>
      <th>Category</th>
      <th>Start Time</th>
      <th>End Time</th>
      <th>Status</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/vacation-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="v in vacations">
      <tr>
        <td x-text="v.id" class="narrow"></td>
        <td><a class="blue" x-text="v.employee.fullName" :href="'#/employee-page/' + v.employee.id"></a></td>
        <td x-text="v.category.name"></td>
        <td x-text="formatter.formatTime(v.startTime)"></td>
        <td x-text="formatter.formatTime(v.endTime)"></td>
        <td x-text="v.status"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/vacation-page/' + v.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/vacation-form/' + v.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(v.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(vacations)" @click="load()">Load More</a>
  </div>
</div>
