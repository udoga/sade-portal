<div x-data="new VacationListComponent(vacationClient, notifier)" x-init="loadAll(employeeClient)">
  <h2>Vacations</h2>
  <table>
    <tr>
      <th class="narrow">Id</th>
      <th>Employee</th>
      <th>Vacation Type</th>
      <th>Replacement Employee</th>
      <th>Start Time</th>
      <th>End Time</th>
      <th>Status</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/vacation-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="vacation in vacations">
      <tr>
        <td x-text="vacation.id" class="narrow"></td>
        <td x-text="getEmployeeName(vacation.employeeId)"></td>
        <td x-text="vacation.vacationType"></td>
        <td x-text="getEmployeeName(vacation.replacementEmployeeId)"></td>
        <td x-text="vacation.startTime"></td>
        <td x-text="vacation.endTime"></td>
        <td x-text="vacation.status"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/vacation-page/' + vacation.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/vacation-form/' + vacation.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(vacation.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
