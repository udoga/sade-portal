<div x-data="new ExpenseFormComponent(router, expenseClient, notifier)">
  <h2>Expense Form</h2>
  <form @expense-event.window="expense = $event.detail">
    <div class="field">
      <label>User Id</label>
      <input type="text" placeholder="User Id" x-model="expense.userId"/>
    </div>
    <div class="field">
      <label>Form Date</label>
      <input type="date" placeholder="Form Date" x-model="expense.formDate"/>
    </div>
    <div class="field">
      <label>Amount</label>
      <input type="number" min="0" value="0" step="0.01" placeholder="Amount" x-model="expense.amount"/>
    </div>
    <div class="field">
      <label>Currency</label>
      <input list="currency" placeholder="Currency" x-model="expense.currency"/>
      <datalist id="currency">
        <option value="TRY">
        <option value="EUR">
        <option value="USD">
      </datalist>
    </div>
    <div class="field">
      <label>Paid</label>
      <input type="checkbox" placeholder="Paid" x-model="expense.paid"/>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea placeholder="Description" x-model="expense.description"></textarea>
    </div>
    <div class="field">
      <label>Status</label>
      <input list="status" placeholder="Status" x-model="expense.status"/>
      <datalist id="status">
        <option value="Approved">
        <option value="Rejected">
      </datalist>
    </div>
    <div class="options">
      <a class="white form button" @click="quit()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
