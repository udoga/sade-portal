<div x-data="new ExpenseFormComponent(router, expenseApi, notifier)" x-init="loadAll(employeeApi)">
  <h2>Expense Form</h2>
  <form>
    <div class="field">
      <label class="sp">Employee</label>
      <select class="sp" x-model="expense.employeeId">
        <option value="" selected>Select Employee</option>
        <template x-for="e in employees" :key="e.id">
          <option :value="e.id" x-text="e.fullName" :selected="expense.employeeId === e.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Form Date</label>
      <input type="date" class="sp" placeholder="Form Date" x-model="expense.formDate" />
    </div>
    <div class="field">
      <label class="sp">Description</label>
      <textarea class="sp" placeholder="Description" x-model="expense.description"></textarea>
    </div>
    <div class="field">
      <label class="sp">Status</label>
      <input type="text" class="sp" placeholder="Status" x-model="expense.status" />
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
