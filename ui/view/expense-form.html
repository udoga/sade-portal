<div x-data="new ExpenseFormComponent(router, expenseApi, notifier)" x-init="load()">
  <h2>Expense Form</h2>
  <form>
    <div class="field">
      <label>Employee Id</label>
      <input type="text" placeholder="Employee Id" x-model="expense.employeeId"/>
    </div>
    <div class="field">
      <label>Form Date</label>
      <input type="date" placeholder="Form Date" x-model="expense.formDate"/>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea placeholder="Description" x-model="expense.description"></textarea>
    </div>
    <div class="field">
      <label>Status</label>
      <input list="status" placeholder="Status" x-model="expense.status"/>
      <datalist id="status">
        <option value="Approved">
        <option value="Rejected">
      </datalist>
    </div>
    <div class="options">
      <a class="white form button" @click="quit()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
