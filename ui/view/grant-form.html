<div x-data="new GrantFormComponent(router, grantApi, notifier)" x-init="loadAll(roleApi, permissionApi)">
  <h2>Grant Form</h2>
  <form>
    <div class="field">
      <label>Role</label>
      <select class="padded" x-model="grant.roleId">
        <option value="" disabled selected>Select Role</option>
        <template x-for="r in roles" :key="r.id">
          <option :value="r.id" x-text="r.name" :selected="grant.roleId === r.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label>Permission</label>
      <select class="padded" x-model="grant.permissionId">
        <option value="" disabled selected>Select Permission</option>
        <template x-for="p in permissions" :key="p.id">
          <option :value="p.id" x-text="p.name" :selected="grant.permissionId === p.id"></option>
        </template>
      </select>
    </div>
  </form>
  <div class="options">
    <a class="white form button" href="javascript:history.back()">Back</a>
    <a class="green form button" @click="save()">Save</a>
  </div>
</div>
