<div ng-controller="LeaveFormController">
    <h2>Leave Form</h2>
    <form>
        <div class="field">
            <label>Person ID</label>
            <input type="text" placeholder="Person ID" ng-model="leave.personId"/>
        </div>
        <div class="field">
            <label>Leave Type</label>
            <input list="leaves" placeholder="Leave Type" ng-model="leave.leaveType"/>
            <datalist id="leaves">
                <option value="ParentalLeave">
                <option value="BereavementLeave">
                <option value="BreastFeedingLeave">
                <option value="PersonalLeave">
                <option value="MarriageLeave">
                <option value="MilitaryLeave">
                <option value="MaternityLeave">
                <option value="PaternityLeave">
                <option value="UnpaidLeave">
                <option value="MedicalLeave">
                <option value="AnnualLeave">
                <option value="BirthdayLeave">
                <option value="RemoteWorking">
            </datalist>
        </div>
        <div class="field">
            <label>Replacement Person ID</label>
            <input type="text" placeholder="Replacement Person ID" ng-model="leave.replacementPersonId"/>
        </div>
        <div class="field">
            <label>Start Time</label>
            <input type="datetime-local" placeholder="Start Time" ng-model="leave.startTime"/>
        </div>
        <div class="field">
            <label>End Time</label>
            <input type="datetime-local" placeholder="End Time" ng-model="leave.endTime"/>
        </div>
        <div class="field">
            <label>Day Count</label>
            <input type="number" placeholder="Day Count" ng-model="leave.dayCount"/>
        </div>
        <div class="field">
            <label>Description</label>
            <textarea placeholder="Description" ng-model="leave.description"></textarea>
        </div>
        <div class="field">
            <label>Status</label>
            <input list="status" placeholder="Status" ng-model="leave.status"/>
            <datalist id="status">
                <option value="Approved">
                <option value="Rejected">
            </datalist>
        </div>
        <div class="options">
            <a class="white form button" href="#!leaves">Back</a>
            <a class="green form button" href ng-click="save()">Save</a>
        </div>
    </form>
</div>
