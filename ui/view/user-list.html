<div ng-controller="UserListController">
  <h2>Users</h2>
  <table>
    <tr>
      <th class="narrow">Id</th>
      <th>Username</th>
      <th>Birth Date</th>
      <th class="narrow options">
        <a class="green header button" ng-href="#!users/new">New</a>
      </th>
    </tr>
    <tr ng-repeat="user in users">
      <td class="narrow">{{user.id}}</td>
      <td>{{user.username}}</td>
      <td>{{user.birthDate}}</td>
      <td class="narrow options">
        <a class="light-blue row button" ng-href="#!users/{{user.id}}">Show</a>
        <a class="yellow row button" ng-href="#!users/{{user.id}}/edit">Edit</a>
        <a class="red row button" href ng-click="delete(user.id)">Delete</a>
      </td>
    </tr>
  </table>
</div>
