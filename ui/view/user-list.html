<div x-data="new UserListComponent(userApi, notifier)" x-init="load()">
  <h2>Users</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Username</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/user-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="user in users">
      <tr>
        <td x-text="user.id" class="narrow"></td>
        <td x-text="user.username"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/user-page/' + user.id">
            <i class="fas fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/user-form/' + user.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(user.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
