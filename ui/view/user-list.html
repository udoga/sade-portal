<div x-data="new UserListComponent(router, userApi, notifier)" x-init="load()">
  <h2>Users</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Username</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/user-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="u in users">
      <tr>
        <td x-text="u.id" class="narrow"></td>
        <td x-text="u.username"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/user-page/' + u.id">
            <i class="fas fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/user-form/' + u.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(u.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(users)" @click="loadMore()">Load More</a>
  </div>
</div>
