<div ng-controller="UserListController">
  <h2>Users</h2>
  <table>
    <tr>
      <th class="min">Id</th>
      <th>Username</th>
      <th class="min"><a ng-href="#!users/new">New</a></th>
    </tr>
    <tr ng-repeat="user in users">
      <td class="min">{{user.id}}</td>
      <td>{{user.username}}</td>
      <td class="min">
        <a ng-href="#!users/{{user.id}}">Read</a>
        <a ng-href="#!users/{{user.id}}/edit">Edit</a>
        <a href ng-click="delete(user.id)">Delete</a>
      </td>
    </tr>
  </table>
</div>
