<div ng-controller="LeaveListController">
    <h2>Leaves</h2>
    <table>
        <tr>
            <th class="narrow">ID</th>
            <th>Person ID</th>
            <th>Leave Type</th>
            <th>Replacement Person ID</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Status</th>
            <th class="narrow last">
                <a class="green header icon button" ng-href="#!leaves/new"><i class="fas fa-plus"></i>New</a>
            </th>
        </tr>
        <tr ng-repeat="leave in leaves">
            <td class="narrow">{{leave.id}}</td>
            <td>{{leave.personId}}</td>
            <td>{{leave.leaveType}}</td>
            <td>{{leave.replacementPersonId}}</td>
            <td>{{leave.startTime}}</td>
            <td>{{leave.endTime}}</td>
            <td>{{leave.status}}</td>
            <td class="narrow last">
                <a title="Show" class="light-blue row button" ng-href="#!leaves/{{leave.id}}">
                    <i class="far fa-eye"></i>
                </a>
                <a title="Edit" class="yellow row button" ng-href="#!leaves/{{leave.id}}/edit">
                    <i class="fas fa-pencil-alt"></i>
                </a>
                <a title="Delete" class="red row button" href ng-click="delete(leave.id)">
                    <i class="fas fa-trash"></i>
                </a>
            </td>
        </tr>
    </table>
</div>
