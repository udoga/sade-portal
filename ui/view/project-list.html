<div x-data="new ProjectListComponent(router, projectApi, notifier)" x-init="loadAll(clientApi)">
  <h2>Projects</h2>
  <div class="field">
    <select class="sp" x-model="query.clientId" @change="reload()">
      <option value="">All Clients</option>
      <template x-for="c in clients">
        <option :value="c.id" x-text="c.name" :selected="query.clientId === c.id"></option>
      </template>
    </select>
  </div>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Name</th>
      <th>Client</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/project-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="p in projects">
      <tr>
        <td x-text="p.id" class="narrow"></td>
        <td x-text="p.name"></td>
        <td><a class="blue" x-text="p.client.name" :href="'#/client-page/' + p.client.id"></a></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/project-page/' + p.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/project-form/' + p.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(p.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(projects)" @click="load()">Load More</a>
  </div>
</div>
