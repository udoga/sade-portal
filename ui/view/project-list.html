<div x-data="new ProjectListComponent(router, projectApi, notifier)" x-init="loadAll(clientApi)">
  <h2>Projects</h2>
  <div class="query">
    <select class="padded" x-model="query.clientId" @change="reload('detailed')">
      <option value="">All Clients</option>
      <template x-for="c in clients">
        <option :value="c.id" x-text="c.name" :selected="query.clientId === c.id"></option>
      </template>
    </select>
  </div>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Name</th>
      <th>Client</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/project-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="project in projects">
      <tr>
        <td x-text="project.id" class="narrow"></td>
        <td x-text="project.name"></td>
        <td x-text="project.client.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/project-page/' + project.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/project-form/' + project.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(project.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
