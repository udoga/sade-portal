<div x-data="new ReceiptPageComponent(router, receiptApi, notifier)" x-init="load()">
  <h2>Receipt</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="receipt.id"></span>
    </div>
    <div class="field">
      <label>Expense Id:</label>
      <span x-text="receipt.expenseId"></span>
    </div>
    <div class="field">
      <label>Receipt Date:</label>
      <span x-text="receipt.receiptDate"></span>
    </div>
    <div class="field">
      <label>Category Id:</label>
      <span x-text="receipt.categoryId"></span>
    </div>
    <div class="field">
      <label>Amount:</label>
      <span x-text="receipt.amount"></span>
    </div>
    <div class="field">
      <label>Currency:</label>
      <span x-text="receipt.currency"></span>
    </div>
    <div class="field">
      <label>Vat Rate:</label>
      <span x-text="receipt.vatRate"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="receipt.description"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/receipt-list">Back</a>
      <a class="yellow form button" :href="'#/receipt-form/' + receipt.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
