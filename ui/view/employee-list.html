<div x-data="new EmployeeListComponent(employeeApi, notifier)" x-init="loadAll(userApi)">
  <h2>Employees</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Username</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/employee-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="employee in employees">
      <tr>
        <td x-text="employee.id" class="narrow"></td>
        <td x-text="getUsername(employee.userId)"></td>
        <td x-text="employee.firstName"></td>
        <td x-text="employee.lastName"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/employee-page/' + employee.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/employee-form/' + employee.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(employee.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
