<div x-data="new EmployeeListComponent(router, employeeApi, notifier)" x-init="load()">
  <h2>Employees</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Name</th>
      <th>User</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/employee-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="e in employees">
      <tr>
        <td x-text="e.id" class="narrow"></td>
        <td x-text="e.fullName"></td>
        <td><a class="blue" x-text="e.user.username" :href="'#/user-page/' + e.user.id"></a></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/employee-page/' + e.id">
            <i class="fas fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/employee-form/' + e.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(e.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(employees)" @click="loadMore()">Load More</a>
  </div>
</div>
