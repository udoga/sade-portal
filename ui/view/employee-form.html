<div x-data="new EmployeeFormComponent(router, employeeApi, notifier)" x-init="loadAll(userApi)">
  <h2>Employee Form</h2>
  <form>
    <div class="field">
      <label>User</label>
      <input type="text" x-model="search" @input="filterOptions" placeholder="Username" class="dropdown-input"/>
      <div x-show="search.length > 0" x-model="employee.userId" class="dropdown-menu">
        <template x-for="user in filteredUsers">
          <div x-text="user.username" @click="selectUser(user)" class="dropdown-item"></div>
        </template>
      </div>
    </div>
    <div class="field">
      <label>First Name</label>
      <input type="text" placeholder="First Name" x-model="employee.firstName"/>
    </div>
    <div class="field">
      <label>Last Name</label>
      <input type="text" placeholder="Last Name" x-model="employee.lastName"/>
    </div>
    <div class="options">
      <a class="white form button" @click="quit()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
