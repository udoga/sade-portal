<div x-data="new EmployeeFormComponent(router, employeeClient, notifier)" x-init="load()">
  <h2>Employee Form</h2>
  <form>
    <div class="field">
      <label>User Id</label>
      <input type="text" placeholder="User Id" x-model="employee.userId"/>
    </div>
    <div class="field">
      <label>First Name</label>
      <input type="text" placeholder="First Name" x-model="employee.firstName"/>
    </div>
    <div class="field">
      <label>Last Name</label>
      <input type="text" placeholder="Last Name" x-model="employee.lastName"/>
    </div>
    <div class="options">
      <a class="white form button" @click="quit()">Back</a>
      <a class="green form button" @click="save()">Save</a>
    </div>
  </form>
</div>
