<div x-data="new RoleListComponent(router, roleApi, notifier)" x-init="load()">
  <h2>Roles</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Name</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/role-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="r in roles">
      <tr>
        <td x-text="r.id" class="narrow"></td>
        <td x-text="r.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/role-page/' + r.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/role-form/' + r.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(r.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
  <div class="options">
    <a class="white form button" x-show="hasMore(roles)" @click="load()">Load More</a>
  </div>
</div>
