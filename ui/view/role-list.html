<div x-data="new RoleListComponent(roleApi, notifier)" x-init="load()">
  <h2>Roles</h2>
  <table class="records">
    <tr>
      <th class="narrow">Id</th>
      <th>Name</th>
      <th class="narrow last">
        <a class="green header icon button" href="#/role-form"><i class="fas fa-plus"></i> New</a>
      </th>
    </tr>
    <template x-for="role in roles">
      <tr>
        <td x-text="role.id" class="narrow"></td>
        <td x-text="role.name"></td>
        <td class="narrow last">
          <a title="Show" class="light-blue row button" :href="'#/role-page/' + role.id">
            <i class="far fa-eye"></i>
          </a>
          <a title="Edit" class="yellow row button" :href="'#/role-form/' + role.id">
            <i class="fas fa-pencil-alt"></i>
          </a>
          <a title="Delete" class="red row button" @click="remove(role.id)">
            <i class="fas fa-trash"></i>
          </a>
        </td>
      </tr>
    </template>
  </table>
</div>
