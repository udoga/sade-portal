<div class="login" x-data="new LoginComponent(router, sessionApi)" @keyup.enter="login()">
  <h2>Login</h2>
  <form>
    <div class="field">
      <label class="sp">Username</label>
      <input type="text" class="sp wide" placeholder="Username" x-model="user.username"/>
    </div>
    <div class="field">
      <label class="sp">Password</label>
      <input type="password" class="sp wide" placeholder="Password" x-model="user.password"/>
    </div>
  </form>
  <div class="options">
    <a class="green form button" @click="login()">Login</a>
  </div>
  <div class="error" x-show="errorMessage" x-text="errorMessage">
  </div>
</div>
