<div class="login" x-data="new LoginComponent(router, sessionApi)" @keyup.enter="login()">
  <h2>Login</h2>
  <form>
    <div class="field">
      <input type="text" placeholder="Username" x-model="user.username"/>
    </div>
    <div class="field">
      <input type="password" placeholder="Password" autocomplete="on" x-model="user.password"/>
    </div>
  </form>
  <div class="options">
    <a class="green form button" @click="login()">Login</a>
  </div>
  <div class="error" x-show="errorMessage" x-text="errorMessage">
  </div>
</div>
