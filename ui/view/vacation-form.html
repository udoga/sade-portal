<div x-data="new VacationFormComponent(router, vacationApi, notifier)"
     x-init="loadAll(employeeApi, vacationCategoryApi)">
  <h2>Vacation Form</h2>
  <form>
    <div class="field">
      <label class="sp">Employee</label>
      <select class="sp" x-model="vacation.employeeId">
        <option value="" selected>Select Employee</option>
        <template x-for="e in employees" :key="e.id">
          <option :value="e.id" x-text="e.fullName" :selected="vacation.employeeId === e.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Category</label>
      <select class="sp" x-model="vacation.categoryId">
        <option value="" selected>Select Category</option>
        <template x-for="category in categories" :key="category.id">
          <option :value="category.id" x-text="category.name" :selected="vacation.categoryId === category.id"></option>
        </template>
      </select>
    </div>
    <div class="field">
      <label class="sp">Start Time</label>
      <input type="datetime-local" class="sp" placeholder="Start Time" x-model="vacation.startTime"/>
    </div>
    <div class="field">
      <label class="sp">End Time</label>
      <input type="datetime-local" class="sp" placeholder="End Time" x-model="vacation.endTime"/>
    </div>
    <div class="field">
      <label class="sp">Day Count</label>
      <input type="number" class="sp" placeholder="Day Count" x-model="vacation.dayCount"/>
    </div>
    <div class="field">
      <label class="sp">Description</label>
      <textarea class="sp" placeholder="Description" x-model="vacation.description"></textarea>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="green form button" @click="saveVacation()">Save</a>
    </div>
  </form>
</div>
