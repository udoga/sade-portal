<div x-data="new VacationFormComponent(router, vacationApi, notifier)" x-init="load()">
  <h2>Vacation Form</h2>
  <form>
    <div class="field">
      <label>Employee Id</label>
      <input type="text" placeholder="Employee Id" x-model="vacation.employeeId"/>
    </div>
    <div class="field">
        <label>Category Id</label>
        <input type="text" placeholder="Category Id" x-model="vacation.categoryId"/>
      </div>
    <div class="field">
      <label>Start Time</label>
      <input type="text" placeholder="Start Time" x-model="vacation.startTime"/>
    </div>
    <div class="field">
      <label>End Time</label>
      <input type="text" placeholder="End Time" x-model="vacation.endTime"/>
    </div>
    <div class="field">
      <label>Day Count</label>
      <input type="number" placeholder="Day Count" x-model="vacation.dayCount"/>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea placeholder="Description" x-model="vacation.description"></textarea>
    </div>
    <div class="options">
      <a class="white form button" @click="quit()">Back</a>
      <a class="green form button" @click="saveVacation()">Save</a>
    </div>
  </form>
</div>
