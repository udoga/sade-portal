<div x-data="new WorklogPageComponent(router, worklogApi, notifier)" x-init="load()">
  <h2>Worklog</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="worklog.id"></span>
    </div>
    <div class="field">
      <label>Project:</label>
      <a class="blue" x-text="getProject().name" :href="'#/project-page/' + worklog.projectId"></a>
    </div>
    <div class="field">
      <label>Employee:</label>
      <a class="blue" x-text="getEmployee().fullName" :href="'#/employee-page/' + worklog.employeeId"></a>
    </div>
    <div class="field">
      <label>Activity:</label>
      <span x-text="getActivity().name"></span>
    </div>
    <div class="field">
      <label>Work Date:</label>
      <span x-text="worklog.workDate"></span>
    </div>
    <div class="field">
      <label>Duration:</label>
      <span x-text="worklog.duration"></span>
    </div>
    <div class="field">
      <label>Status:</label>
      <span x-text="worklog.status"></span>
    </div>
    <div class="field">
      <label>Description:</label>
      <span x-text="worklog.description"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item first" @click="selectTab('project')" :class="getTabClass('project')">Project</span>
        <span class="panel-item" @click="selectTab('employee')" :class="getTabClass('employee')">Employee</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelectedTab('project')">
          <div class="field">
            <label>Id:</label>
            <span x-text="getProject().id"></span>
          </div>
          <div class="field">
            <label>Name:</label>
            <a class="blue" x-text="getProject().name" :href="'#/project-page/' + getProject().id"></a>
          </div>
          <div>
            <label>Description:</label>
            <span x-text="getProject().description"></span>
          </div>
        </div>
        <div x-show="isSelectedTab('employee')">
          <div class="field">
            <label>Id:</label>
            <span x-text="getEmployee().id"></span>
          </div>
          <div>
            <label>Name:</label>
            <a class="blue" x-text="getEmployee().fullName" :href="'#/employee-page/' + getEmployee().id"></a>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="yellow form button" :href="'#/worklog-form/' + worklog.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
