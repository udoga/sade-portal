<div x-data="new UserPageComponent(router, userApi, notifier, assignmentApi, employeeApi)" x-init="load()">
  <h2>User</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="user.id"></span>
    </div>
    <div class="field">
      <label>Username:</label>
      <span x-text="user.username"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="selectTab('assignments')" :class="getTabClass('assignments')">Roles</span>
        <span class="panel-item" @click="selectTab('employee')" :class="getTabClass('employee')">Employee</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelectedTab('assignments')">
          <table class="relations">
            <tr>
              <th class="narrow">Role Id</th>
              <th>Role Name</th>
              <th class="last narrow">
                <a class="green header icon button" :href="'#/assignment-form?userId=' + user.id">
                  <i class="fas fa-plus"></i> New
                </a>
              </th>
            </tr>
            <template x-for="a in assignments">
              <tr>
                <td x-text="a.role.id" class="narrow"></td>
                <td x-text="a.role.name"></td>
                <td class="last narrow">
                  <a title="Delete" class="red row button" @click="removeAssignment(a.id)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
              </tr>
            </template>
          </table>
          <div class="options">
            <a class="white form button" x-show="hasMore(assignments)" @click="loadAssignments()">Load More</a>
          </div>
        </div>
        <div x-show="isSelectedTab('employee')">
          <div x-show="!hasData(employee)">
            <div class="panel-message">This user is not an employee.</div>
          </div>
          <div x-show="hasData(employee)">
            <div class="field">
              <label>Employee Id:</label>
              <span x-text="employee.id"></span>
            </div>
            <div class="field">
              <label>First Name:</label>
              <span x-text="employee.firstName"></span>
            </div>
            <div class="last field">
              <label>Last Name:</label>
              <span x-text="employee.lastName"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="javascript:history.back()">Back</a>
      <a class="yellow form button" :href="'#/user-form/' + user.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
