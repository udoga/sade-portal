<div x-data="new UserPageComponent(router, userClient, notifier)" x-init="loadAll(roleClient)">
  <h2>User</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="user.id"></span>
    </div>
    <div class="field">
      <label>Username:</label>
      <span x-text="user.username"></span>
    </div>
    <div class="field">
      <label>Role Names:</label>
      <span x-text="getRoleNames()"></span>
    </div>
    <div class="options">
      <a class="white form button" href="#/user-list">Back</a>
      <a class="yellow form button" :href="'#/user-form/' + user.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
