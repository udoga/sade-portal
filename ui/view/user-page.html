<div x-data="new UserPageComponent(router, userApi, notifier, employeeApi, assignmentApi)" x-init="load()">
  <h2>User</h2>
  <div>
    <div class="field">
      <label>Id:</label>
      <span x-text="user.id"></span>
    </div>
    <div class="field">
      <label>Username:</label>
      <span x-text="user.username"></span>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-item" @click="select('assignments')" :class="getClass('assignments')">Roles</span>
        <span class="panel-item" @click="select('employee')" :class="getClass('employee')">Employee</span>
      </div>
      <div class="panel-content">
        <div x-show="isSelected('assignments')">
          <table class="relations">
            <tr>
              <th class="narrow">Role Id</th>
              <th>Role Name</th>
              <th></th>
            </tr>
            <template x-for="a in assignments">
              <tr>
                <td x-text="a.role.id" class="narrow"></td>
                <td x-text="a.role.name"></td>
                <td class="narrow">
                  <a title="Delete" class="red row button" @click="removeAssignment(a.id)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>
              </tr>
            </template>
          </table>
        </div>
        <div x-show="isSelected('employee')">
          <div x-show="isEmployee()">
            <div class="field">
              <label>Employee Id:</label>
              <span x-text="employee.id"></span>
            </div>
            <div class="field">
              <label>First Name:</label>
              <span x-text="employee.firstName"></span>
            </div>
            <div class="last field">
              <label>Last Name:</label>
              <span x-text="employee.lastName"></span>
            </div>
          </div>
          <div x-show="!isEmployee()">
            <div class="panel-message">This user is not an employee.</div>
          </div>
        </div>
      </div>
    </div>
    <div class="options">
      <a class="white form button" href="#/user-list">Back</a>
      <a class="yellow form button" :href="'#/user-form/' + user.id">Edit</a>
      <a class="red form button" @click="remove()">Delete</a>
    </div>
  </div>
</div>
